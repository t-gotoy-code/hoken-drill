<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>学校バトラーズ</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学校バトラーズ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f39a12">
<script>
  // 学校バトラーズ本体（GASウェブアプリ）のURL
  var APP_URL = "https://script.google.com/macros/s/AKfycbxTiT7paEX8t9fsQ4x2CYbuovDoUIlmKUuTEbHgrD0-31pJg6UJPNXgiroVagyqP9Lpcw/exec";
  // ホーム画面のアイコンから起動したときは、すぐ本体へ移動する
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  if (standalone) { location.replace(APP_URL); }
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, #fff4dc, #ffffff);
    color: #3a2200; display: flex; justify-content: center; padding: 32px 20px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .icon { width: 120px; height: 120px; border-radius: 27px; box-shadow: 0 8px 24px rgba(200,120,0,.3); }
  h1 { font-size: 28px; margin: 16px 0 4px; }
  .lead { margin: 0 0 24px; color: #4a6380; }
  .open {
    display: block; padding: 16px; border-radius: 14px; text-decoration: none;
    background: #f39a12; color: #fff; font-size: 20px; font-weight: bold;
    box-shadow: 0 4px 0 #c46f00;
  }
  .card { margin-top: 28px; padding: 18px 20px; background: #fff; border-radius: 16px; text-align: left; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  .card h2 { font-size: 17px; margin: 0 0 10px; }
  .card ol { margin: 0; padding-left: 1.4em; line-height: 1.8; }
  .share { display: inline-block; vertical-align: -3px; }
  .note { font-size: 13px; color: #6b7f96; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="apple-touch-icon.png" alt="学校バトラーズのアイコン">
  <h1>学校バトラーズ</h1>
  <p class="lead">カードを集めて、バトルしよう！</p>
  <a class="open" id="open" href="#">学校バトラーズをはじめる</a>

  <section class="card">
    <h2>📱 ホーム画面に追加する方法（iPhone）</h2>
    <ol>
      <li>このページを <b>Safari</b> で開く</li>
      <li>画面下の共有ボタン
        <svg class="share" width="18" height="20" viewBox="0 0 18 20" fill="none" stroke="#f39a12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 13V1M5 5l4-4 4 4M5 8H2v11h14V8h-3"/></svg>
        をタップ</li>
      <li>「<b>ホーム画面に追加</b>」をタップ</li>
      <li>右上の「<b>追加</b>」をタップ</li>
    </ol>
    <p class="note">ホーム画面のアイコンをタップすると、学校バトラーズがすぐ開きます。</p>
  </section>
</main>
<script>document.getElementById("open").href = APP_URL;</script>
</body>
</html>
