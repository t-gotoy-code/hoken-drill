<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>進路ナビ</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="進路ナビ">
<meta name="theme-color" content="#1f6fe5">
<script>
  // 進路ナビ本体（GASウェブアプリ・学校アカウントでログインが必要）
  var APP_URL = "https://script.google.com/a/macros/e.osakamanabi.jp/s/AKfycbzxvXUzLVdOMsukl_kAo_RaNfhmKkWm2D7ZlOZ3xsclNDQaGTQWgrdJYPu4o1IwRsO1/exec";
  // 配布用URL（?setup 付き）で開いたときだけ案内を表示し、URLを ?setup なしに書き換える。
  // ホーム画面に追加されるのは ?setup なしのURLなので、アイコンから開くとすぐ本体へ移動する。
  // （学校アカウントのログインを使うため、Safariで開く通常のブックマーク方式にしている）
  if (location.search.indexOf("setup") === -1) {
    location.replace(APP_URL);
  } else {
    history.replaceState(null, "", location.pathname);
  }
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, #e8f1ff, #ffffff);
    color: #12305e; display: flex; justify-content: center; padding: 32px 20px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  .icon { width: 120px; height: 120px; border-radius: 27px; box-shadow: 0 8px 24px rgba(30,110,200,.25); }
  h1 { font-size: 28px; margin: 16px 0 4px; }
  .lead { margin: 0 0 24px; color: #4a6380; }
  .open {
    display: block; padding: 16px; border-radius: 14px; text-decoration: none;
    background: #1f6fe5; color: #fff; font-size: 20px; font-weight: bold;
    box-shadow: 0 4px 0 #1552b3;
  }
  .card { margin-top: 28px; padding: 18px 20px; background: #fff; border-radius: 16px; text-align: left; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  .card h2 { font-size: 17px; margin: 0 0 10px; }
  .card ol { margin: 0; padding-left: 1.4em; line-height: 1.8; }
  .share { display: inline-block; vertical-align: -3px; }
  .note { font-size: 13px; color: #6b7f96; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="apple-touch-icon.png" alt="進路ナビのアイコン">
  <h1>進路ナビ</h1>
  <p class="lead">大学・専門学校をさがそう</p>
  <a class="open" id="open" href="#">進路ナビをひらく</a>

  <section class="card">
    <h2>📱 ホーム画面に追加する方法（iPhone）</h2>
    <ol>
      <li>このページを <b>Safari</b> で開く</li>
      <li>画面下の共有ボタン
        <svg class="share" width="18" height="20" viewBox="0 0 18 20" fill="none" stroke="#1f6fe5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 13V1M5 5l4-4 4 4M5 8H2v11h14V8h-3"/></svg>
        をタップ</li>
      <li>「<b>ホーム画面に追加</b>」をタップ</li>
      <li>右上の「<b>追加</b>」をタップ</li>
    </ol>
    <p class="note">ホーム画面のアイコンから開くと、進路ナビがすぐ表示されます。学校のGoogleアカウントでログインして使ってください。</p>
  </section>
</main>
<script>document.getElementById("open").href = APP_URL;</script>
</body>
</html>
